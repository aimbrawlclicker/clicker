<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AimBrawlClicker v0.8.3</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root { --primary: #00c6ff; --bg: #0f172a; --card-bg: #1e293b; --admin-neon: #ff00ff; --gold: #fbbf24; }
body { margin: 0; font-family: 'Inter', sans-serif; background: var(--bg); color: #ffffff; user-select: none; touch-action: manipulation; }
.header { display: flex; justify-content: space-between; align-items: center; padding: 15px; font-weight: 800; }
.card { margin: 10px; padding: 15px; background: var(--card-bg); border-radius: 20px; text-align: center; }
.stat-box { display: flex; justify-content: space-around; margin-top: 10px; background: #0f172a; padding: 10px; border-radius: 12px; font-size: 0.9rem; }
.clickBtn { width: 150px; height: 150px; border-radius: 50%; background: radial-gradient(circle, var(--primary) 0%, #0072ff 100%); margin: 20px auto; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 0 20px rgba(0, 198, 255, 0.3); }
.drop-box { border: 2px solid var(--gold); padding: 10px; border-radius: 12px; margin: 10px; cursor: pointer; background: #2d1e08; }
.shop-item { display: flex; justify-content: space-between; align-items: center; background: #0f172a; padding: 10px; border-radius: 12px; margin-bottom: 8px; font-size: 0.85rem; }
.admin-panel { display: none; margin: 10px; padding: 15px; border: 2px dashed var(--admin-neon); border-radius: 15px; text-align: center; }
button { cursor: pointer; border-radius: 8px; border: none; font-weight: bold; padding: 8px; }
</style>
</head>
<body>

<div class="header">
  <div>AimBrawl <span style="color:var(--primary)">Clicker</span></div>
  <button style="background:none; border:1px solid var(--admin-neon); color:var(--admin-neon);" onclick="document.getElementById('adminPanel').style.display='block'">DEV</button>
</div>

<div class="admin-panel" id="adminPanel">
  <h3>⚡ DEV PANEL ⚡</h3>
  <button onclick="state.coins+=10000; updateUI()">+10к Монет</button>
  <button onclick="state.dailyDrops=5; updateUI()">+5 Дропов</button>
  <button onclick="document.getElementById('adminPanel').style.display='none'">ЗАКРЫТЬ</button>
</div>

<div class="card">
  <div id="rankBadge" style="padding:5px; border:1px solid gray; border-radius:8px; display:inline-block;">Без ранга</div>
  <h3 style="margin:10px 0;">🪙 <span id="coinsVal">0</span> | 💎 <span id="crystalsVal">0</span></h3>
  <button style="background:#10b981; color:white; width:100%;" onclick="exchangeCurrency()">♻️ Обмен 1000 🪙 -> 1 💎</button>
  <button id="superBtn" style="background:var(--gold); width:100%; margin-top:5px;" onclick="doSuperClick()">СУПЕР КЛИК</button>
  <div class="stat-box">
    <div>Сила: <b id="powerVal">1</b></div>
    <div>КД: <b id="delayVal">1с</b></div>
  </div>
</div>

<div id="dropSection" class="drop-box" onclick="openDrop()">
  Старрдропы: <b id="dropCount">0</b>/5 (Открыть)
</div>

<div class="clickBtn" id="clickBtn">💎</div>
<div id="mainTimer" style="text-align:center; color:#f43f5e;"></div>

<div class="card">
  <div class="shop-item"><div>+1 Сила (КД 3с)</div><button onclick="buyPower(1000,1,3000)">1000 🪙</button></div>
  <div class="shop-item"><div>+25 Сила (КД 30м)</div><button onclick="buyPower(20000,25,1800000)">20к 🪙</button></div>
</div>

<script>
let state = JSON.parse(localStorage.getItem("abc_data_v083")) || {
  coins: 0, crystals: 0, power: 1, totalClicks: 0, dailyDrops: 0, 
  totalClicksToday: 0, cooldownUntil: 0, superCooldownUntil: 0, currentDelay: 1000
};

function save() { localStorage.setItem("abc_data_v083", JSON.stringify(state)); }

function updateUI() {
  document.getElementById("coinsVal").innerText = Math.floor(state.coins);
  document.getElementById("crystalsVal").innerText = state.crystals;
  document.getElementById("powerVal").innerText = state.power;
  document.getElementById("delayVal").innerText = (state.currentDelay/1000) + "с";
  document.getElementById("dropCount").innerText = state.dailyDrops;
  save();
}

document.getElementById("clickBtn").onclick = () => {
  if (Date.now() < state.cooldownUntil) return;
  state.coins += state.power;
  state.totalClicks++;
  state.totalClicksToday++;
  state.cooldownUntil = Date.now() + state.currentDelay;
  
  if (state.totalClicksToday >= 100 && state.dailyDrops < 5) {
    state.dailyDrops++;
    state.totalClicksToday = 0;
    alert("🎉 Старрдроп получен!");
  }
  updateUI();
};

function openDrop() {
  if (state.dailyDrops <= 0) return alert("Нет дропов!");
  const roll = Math.random() * 100;
  if (roll < 0.1) { state.crystals += 150; alert("УЛЬТРА: 150 Кристаллов!"); }
  else if (roll < 2) { state.coins += 5000; alert("Легендарный: 5к Монет!"); }
  else { state.coins += 50; alert("Редкий: 50 Монет!"); }
  state.dailyDrops--;
  updateUI();
}

function buyPower(p, pow, del) {
  if(state.coins >= p) { state.coins -= p; state.power += pow; state.currentDelay = del; updateUI(); }
}

function doSuperClick() {
  if(Date.now() > state.superCooldownUntil) {
    state.crystals += 1;
    state.superCooldownUntil = Date.now() + (12 * 3600000);
    updateUI();
  } else alert("Подожди 12 часов!");
}

function exchangeCurrency() {
  if(state.coins >= 1000) { state.coins -= 1000; state.crystals += 1; updateUI(); }
}

updateUI();
</script>
</body>
</html>
