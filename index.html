<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AimBrawlClicker - Система Рангов</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #00c6ff;
  --bg: #0f172a;
  --text: #ffffff;
  --card-bg: #1e293b;
  --input-bg: #0f172a;
  --admin-neon: #ff00ff;
}

body { margin: 0; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); user-select: none; overflow-x: hidden; }

.header { display: flex; justify-content: space-between; padding: 20px; font-weight: 800; }

.card { text-align: center; margin: 15px; padding: 20px; background: var(--card-bg); border-radius: 24px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
.stat-box { display: flex; justify-content: space-around; margin-top: 20px; font-size: 1rem; font-weight: 600; background: var(--input-bg); padding: 15px; border-radius: 15px; }

/* ПЛАШКА РАНГА */
.rank-badge {
  display: inline-block;
  padding: 8px 20px;
  border-radius: 12px;
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 10px;
  background: rgba(0,0,0,0.4);
  transition: 0.3s;
}

.click-container { display: flex; flex-direction: column; align-items: center; gap: 20px; margin-top: 30px; }
.clickBtn { 
    width: 180px; height: 180px; border-radius: 50%; 
    background: radial-gradient(circle, var(--primary) 0%, #0072ff 100%); 
    display: flex; align-items: center; justify-content: center; cursor: pointer; 
    box-shadow: 0 0 30px rgba(0, 198, 255, 0.4); transition: transform 0.1s;
}
.clickBtn:active { transform: scale(0.92); }
#crystalImg { width: 110px; height: 110px; object-fit: contain; }

.shop-container { margin: 20px 15px; padding: 20px; background: var(--card-bg); border-radius: 24px; }
.shop-item { display: flex; justify-content: space-between; align-items: center; background: var(--input-bg); padding: 15px; border-radius: 15px; margin-bottom: 10px; }
.shop-item button { padding: 10px 15px; border-radius: 10px; border: none; background: #fbbf24; color: #0f172a; font-weight: 800; cursor: pointer; }

.admin-panel { display: none; margin: 20px 15px; padding: 20px; border: 2px dashed var(--admin-neon); border-radius: 24px; text-align: center; }
.admin-panel button { background: transparent; border: 1px solid var(--admin-neon); color: var(--admin-neon); padding: 10px; margin: 5px; border-radius: 8px; cursor: pointer; font-weight: bold; }
</style>
</head>
<body>

<div class="header">
  <div>AimBrawl <span style="color:var(--primary)">Clicker</span></div>
  <div style="font-size: 14px; opacity: 0.5;" onclick="toggleAdmin()">v0.8 (Ranks)</div>
</div>

<div class="card">
  <div style="font-size: 0.8rem; opacity: 0.6; margin-bottom: 5px;">ТЕКУЩИЙ РАНГ:</div>
  <div id="rankBadge" class="rank-badge">Без ранга</div>
  
  <h2 style="margin: 15px 0;">Монеты: <span id="coinsVal" style="color:#fbbf24">0</span> 🪙</h2>
  
  <div class="stat-box">
    <div>Сила: <b id="powerVal" style="color:var(--primary)">1</b></div>
    <div>Клики: <b id="clicksVal">0</b></div>
  </div>
</div>

<div class="click-container">
  <div class="clickBtn" id="clickBtn">
    <img src="crystal.png" id="crystalImg" alt="💎">
  </div>
</div>

<div class="shop-container">
  <h3>Прокачка силы</h3>
  <div class="shop-item">
    <div><b>+1 к Силе</b><br><small>Цена: 100 🪙</small></div>
    <button onclick="buyPower(100, 1)">Купить</button>
  </div>
  <div class="shop-item">
    <div><b>+5 к Силе</b><br><small>Цена: 500 🪙</small></div>
    <button onclick="buyPower(500, 5)">Купить</button>
  </div>
  <div class="shop-item">
    <div><b>+25 к Силе</b><br><small>Цена: 2500 🪙</small></div>
    <button onclick="buyPower(2500, 25)">Купить</button>
  </div>
</div>

<div class="admin-panel" id="adminPanel">
  <h3 style="color: var(--admin-neon); margin-top: 0;">DEV PANEL</h3>
  <button onclick="addCheat(100000, 0)">+100к Монет</button>
  <button onclick="addCheat(0, 50000)">+50к Кликов</button>
  <button onclick="resetProgress()">Сбросить всё</button>
</div>

<script>
// Настройки рангов
const RANKS = [
  { name: "Без ранга", threshold: 0, color: "#94a3b8" },
  { name: "Бронза", threshold: 1, color: "#cd7f32" },
  { name: "Серебро", threshold: 100, color: "#e2e8f0" },
  { name: "Золото", threshold: 1000, color: "#fbbf24" },
  { name: "Алмаз", threshold: 5000, color: "#38bdf8" },
  { name: "Мифик", threshold: 15000, color: "#d946ef" },
  { name: "Легенда", threshold: 50000, color: "#f97316" },
  { name: "Мастер", threshold: 300000, color: "#ef4444" },
  { name: "ПРО", threshold: 1000000, color: "#22c55e" }
];

let state = {
  coins: parseInt(localStorage.getItem("abc_coins")) || 0,
  power: parseInt(localStorage.getItem("abc_power")) || 1,
  totalClicks: parseInt(localStorage.getItem("abc_clicks")) || 0
};

function save() {
  localStorage.setItem("abc_coins", state.coins);
  localStorage.setItem("abc_power", state.power);
  localStorage.setItem("abc_clicks", state.totalClicks);
}

// Функция определения ранга
function getCurrentRank(clicks) {
  let current = RANKS[0];
  for (let i = 0; i < RANKS.length; i++) {
    if (clicks >= RANKS[i].threshold) {
      current = RANKS[i];
    } else {
      break;
    }
  }
  return current;
}

function updateUI() {
  document.getElementById("coinsVal").innerText = state.coins;
  document.getElementById("powerVal").innerText = state.power;
  document.getElementById("clicksVal").innerText = state.totalClicks;
  
  // Обновляем визуал ранга
  const rank = getCurrentRank(state.totalClicks);
  const badge = document.getElementById("rankBadge");
  badge.innerText = rank.name;
  badge.style.color = rank.color;
  badge.style.border = `1px solid ${rank.color}`;
  badge.style.boxShadow = `0 0 15px ${rank.color}40`;
}

// Главный клик
document.getElementById("clickBtn").onclick = function() {
  state.coins += state.power;
  state.totalClicks += 1;
  save();
  updateUI();
};

function buyPower(price, powerIncrease) {
  if (state.coins >= price) {
    state.coins -= price;
    state.power += powerIncrease;
    save();
    updateUI();
  } else {
    alert("Недостаточно монет!");
  }
}

// Админка
let adminClicks = 0;
function toggleAdmin() {
  adminClicks++;
  if (adminClicks >= 5) {
    document.getElementById("adminPanel").style.display = "block";
  }
}

function addCheat(coinsAmt, clicksAmt) {
  state.coins += coinsAmt;
  state.totalClicks += clicksAmt;
  save(); updateUI();
}

function resetProgress() {
  if(confirm("Точно сбросить весь прогресс?")) {
    state = { coins: 0, power: 1, totalClicks: 0 };
    save(); updateUI();
  }
}

// Запуск
updateUI();
</script>
</body>
</html>
