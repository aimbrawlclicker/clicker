<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AimBrawlClicker v0.7.1 - Этап 2 (FINAL FIX)</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #00c6ff;
  --bg: #0f172a;
  --text: #ffffff;
  --card-bg: #1e293b;
  --input-bg: #0f172a;
  --input-text: #ffffff;
  --rare: #4ade80;
  --super-rare: #60a5fa;
  --epic: #a855f7;
  --mythic: #f43f5e;
  --legendary: #fbbf24;
  --ultra: #ff3e3e;
  --admin-neon: #ff00ff;
}

.light { --bg: #f1f5f9; --text: #1e293b; --card-bg: #ffffff; --input-bg: #e2e8f0; --input-text: #1e293b; }

body { margin: 0; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); transition: 0.3s; user-select: none; overflow-x: hidden; }

.header { display: flex; justify-content: space-between; padding: 20px; font-weight: 800; }
.version { font-size: 0.8rem; opacity: 0.5; margin-left: 5px; }

/* SIDEBAR */
.sidebar { position: fixed; right: -280px; top: 0; width: 260px; height: 100%; background: var(--card-bg); padding: 30px 20px; transition: 0.3s; z-index: 1000; box-shadow: -5px 0 15px rgba(0,0,0,0.2); }
.sidebar.active { right: 0; }

input, select { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid rgba(0,0,0,0.1); margin: 10px 0 20px; background: var(--input-bg); color: var(--input-text); }

.btn-main { width: 100%; padding: 14px; border-radius: 12px; border: none; background: var(--primary); color: white; font-weight: 700; cursor: pointer; }

#adminLink { display: none; margin-top: 15px; color: var(--admin-neon); font-weight: 800; cursor: pointer; text-align: center; border: 1px solid var(--admin-neon); padding: 8px; border-radius: 10px; }

/* КАРТОЧКИ */
.card { text-align: center; margin: 15px; padding: 20px; background: var(--card-bg); border-radius: 24px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
.stat-box { display: flex; justify-content: space-around; margin-top: 15px; font-size: 0.9rem; }

/* КЛИКЕРЫ */
.click-container { display: flex; flex-direction: column; align-items: center; gap: 20px; margin-top: 10px; }
.clickBtn { 
    width: 160px; height: 160px; border-radius: 50%; 
    background: radial-gradient(circle, var(--primary) 0%, #0072ff 100%); 
    display: flex; align-items: center; justify-content: center; cursor: pointer; 
    box-shadow: 0 0 20px rgba(0, 198, 255, 0.4); transition: 0.1s;
}
.clickBtn:active { transform: scale(0.92); }
#crystalImg { width: 100px; height: 100px; object-fit: contain; background: transparent !important; }

.super-click-btn {
    background: linear-gradient(45deg, #fbbf24, #f59e0b);
    color: white; border: none; padding: 15px 30px; border-radius: 50px;
    font-weight: 800; cursor: pointer; box-shadow: 0 4px 15px rgba(251, 191, 36, 0.4);
}
.super-click-btn:disabled { background: #475569; opacity: 0.7; }

/* НИЖНЯЯ ПАНЕЛЬ */
.bottom-nav { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 92%; max-width: 450px; background: var(--card-bg); display: flex; justify-content: space-around; padding: 12px 5px; border-radius: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); z-index: 900; }
.nav-item { background: none; border: none; color: var(--text); display: flex; flex-direction: column; align-items: center; font-size: 11px; font-weight: 600; cursor: pointer; flex: 1; }
.nav-item span { font-size: 20px; margin-bottom: 4px; }

/* МОДАЛКИ */
.modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 2000; }
.modal-content { background: var(--card-bg); padding: 25px; position: absolute; bottom: 0; width: 100%; box-sizing: border-box; border-radius: 35px 35px 0 0; text-align: center; color: var(--text); max-height: 85vh; overflow-y: auto; }

/* МАГАЗИН */
.shop-item { background: var(--input-bg); padding: 15px; border-radius: 20px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; text-align: left; border-left: 5px solid gray; }
.shop-item.rare { border-color: var(--rare); }
.shop-item.super-rare { border-color: var(--super-rare); }
.shop-item.epic { border-color: var(--epic); }
.shop-item.mythic { border-color: var(--mythic); }
.shop-item.legendary { border-color: var(--legendary); }
.shop-item.ultra { border-color: var(--ultra); }
.shop-btn-group { display: flex; gap: 6px; }
.shop-item button { padding: 8px 12px; border-radius: 10px; border: none; color: white; cursor: pointer; font-weight: bold; font-size: 0.85rem; }
.btn-coin { background: #fbbf24; color: #0f172a !important; }
.btn-crystal { background: var(--primary); }
.shop-item button:disabled { background: #475569; opacity: 0.6; color: #94a3b8 !important; }

/* ЕЖЕДНЕВНЫЕ НАГРАДЫ КАРТОЧКИ */
.day-card { background: var(--input-bg); padding: 10px; border-radius: 12px; font-size: 0.75rem; border: 1px solid transparent; }
.day-card.active { border-color: var(--primary); background: rgba(0,198,255,0.1); }
.day-card.claimed { opacity: 0.4; }

.admin-grid { display: grid; gap: 10px; margin: 20px 0; }
.admin-btn { background: none; border: 1px solid var(--admin-neon); color: var(--admin-neon); padding: 12px; border-radius: 10px; font-weight: 700; cursor: pointer; }

#timer, #superTimer, #dailyTimer { color: #f43f5e; font-weight: 800; font-size: 0.8rem; height: 15px; margin: 5px 0; }

.exchange-btn {
  width: 100%;
  background: #10b981;
  color: white;
  margin: 10px 0;
  font-size: 0.9rem;
  padding: 10px;
  box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
}
</style>
</head>
<body id="body">

<div class="header">
  <div>AimBrawl <span style="color:var(--primary)">Clicker</span><span class="version">v0.7.1 (Этап 2)</span></div>
  <div style="cursor:pointer; font-size:24px;" onclick="toggleMenu()">☰</div>
</div>

<div class="sidebar" id="sidebar">
  <h3 id="t_settings">Настройки / Settings</h3>
  <label id="t_your_id">Ваш ID / ID</label>
  <input id="playerIdInput" placeholder="ID...">
  <div id="adminLink" onclick="openModal('adminModal')">⚡ DEV PANEL ⚡</div>
  <label id="t_theme">Тема / Theme</label>
  <select id="themeSel" onchange="saveSettings()"><option value="dark">Dark</option><option value="light">Light</option></select>
  <label id="t_lang">Язык / Lang</label>
  <select id="langSel" onchange="saveSettings()"><option value="ru">Русский</option><option value="en">English</option></select>
  <button class="btn-main" onclick="saveSettings()" id="t_save">Сохранить</button>
</div>

<div class="card">
  <div style="display: flex; justify-content: space-between; opacity: 0.6; font-size: 0.8rem; padding: 0 5px;">
    <div>ID: <span id="displayId">-</span></div>
    <div><span id="t_total_clicks">Всего кликов</span>: <span id="totalClicksVal">0</span></div>
  </div>
  
  <h2 style="margin: 5px 0;"><span id="t_coins">Монеты</span>: <span id="coinsVal" style="color:#fbbf24">0</span> 🪙</h2>
  <h2 style="margin: 5px 0;"><span id="t_crystals">Кристаллы</span>: <span id="balance" style="color:var(--primary)">0.0</span> 💎</h2>
  
  <button class="btn-main exchange-btn" onclick="exchangeCoins()" id="t_exchange_lbl">♻️ Обменять 1000 🪙 ➔ 1 💎</button>

  <div class="stat-box">
    <div><span id="t_power">Сила</span>: <b id="powerVal">1</b></div>
    <div><span id="t_cooldown">Задержка</span>: <b id="cdVal">3</b>с</div>
  </div>
  <p id="timer"></p>
</div>

<div class="click-container">
  <div class="clickBtn" id="clickBtn">
    <img src="crystal.png" id="crystalImg" alt="💎">
  </div>
  <button class="super-click-btn" id="superBtn" onclick="superClick()">SUPER CLICK 🍀</button>
  <p id="superTimer"></p>
</div>

<div class="modal" id="dailyModal">
  <div class="modal-content">
    <h3 id="t_daily_title">Награды</h3>
    <div id="dailyGrid" style="display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:20px 0;"></div>
    <p id="dailyTimer"></p>
    <button class="btn-main" id="claimBtn" onclick="claimDaily()">Забрать</button>
    <br>
    <button onclick="closeModal('dailyModal')" style="background:none; border:none; color:var(--text); margin-top:15px;" id="t_close_daily">Закрыть</button>
  </div>
</div>

<div class="modal" id="shopModal">
  <div class="modal-content">
    <h3 id="t_shop_title">Магазин Редкостей</h3>
    <div id="shopList"></div>
    <hr style="opacity: 0.1; margin: 15px 0;">
    <div class="shop-item">
       <div><b id="t_super_up">Super-Click 2x Speed</b><br><small id="t_super_desc">24h → 12h</small></div>
       <button id="buySuperUpgrade" class="btn-crystal" onclick="buySuperCD()">💎 100</button>
    </div>
    <button onclick="closeModal('shopModal')" style="background:none; border:none; color:var(--primary); margin-top:10px;" id="t_close_shop">Закрыть</button>
  </div>
</div>

<div class="modal" id="withdrawModal">
  <div class="modal-content">
    <h3 id="t_withdraw_title">Вывод</h3>
    <p id="withdrawConfirmText"></p>
    <button class="btn-main" onclick="createWithdraw()" id="t_req_btn">Создать заявку</button>
    <br>
    <button onclick="closeModal('withdrawModal')" style="opacity:0.5; background:none; border:none; color:var(--text); margin-top:15px;" id="t_cancel">Отмена</button>
  </div>
</div>

<div class="modal" id="adminModal">
  <div class="modal-content" style="border: 2px solid var(--admin-neon);">
    <h2 style="color: var(--admin-neon)">ADMIN PANEL</h2>
    <div class="admin-grid">
      <button class="admin-btn" onclick="adminAction('money')">+100,000 CRYSTALS</button>
      <button class="admin-btn" onclick="adminAction('add_clicks')">+1,000,000 CLICKS (DEV)</button>
      <button class="admin-btn" onclick="adminAction('cd')">RESET MAIN CD</button>
      <button class="admin-btn" onclick="adminAction('unlimited_super')">RESET SUPER CLICK</button>
    </div>
    <button onclick="closeModal('adminModal')" style="color:white; background:none; border:none;">CLOSE</button>
  </div>
</div>

<div class="bottom-nav">
  <button class="nav-item" onclick="openModal('shopModal')"><span>🛒</span><span id="t_nav_shop">Магазин</span></button>
  <button class="nav-item" onclick="openModal('dailyModal')"><span>🎁</span><span id="t_nav_daily">Награды</span></button>
  <button class="nav-item" onclick="openModal('withdrawModal')"><span>💸</span><span id="t_nav_withdraw">Вывод</span></button>
</div>

<script>
const ADMIN_SECRET = "DEV67";
const DAILY_REWARDS = [10, 15, 20, 35, 50, 75, 100];

const translations = {
  ru: {
    t_settings: "Настройки", t_your_id: "Ваш ID", t_theme: "Тема", t_lang: "Язык", t_save: "Сохранить",
    t_crystals: "Кристаллы", t_coins: "Монеты", t_power: "Сила", t_cooldown: "Задержка", t_total_clicks: "Всего кликов",
    t_shop_title: "Магазин Редкостей", t_close_shop: "Закрыть", t_super_up: "Супер-клик x2", t_super_desc: "24ч → 12ч",
    t_withdraw_title: "Вывод", t_req_btn: "Создать заявку", t_cancel: "Отмена",
    t_nav_shop: "Магазин", t_nav_daily: "Награды", t_nav_withdraw: "Вывод",
    t_daily_title: "Награды", t_close_daily: "Закрыть", t_day: "День", t_claim: "Забрать",
    t_exchange_lbl: "♻️ Обменять 1000 🪙 ➔ 1 💎",
    wait: "Жди: ", jackpot: "СУПЕР-КЛИК: ", low_money: "Недостаточно ресурсов!", bought: "Куплено",
    withdraw_to: "Вывод на ID: ", next: "След: ", ex_ok: "Обмен выполнен! +1 💎", ex_err: "Недостаточно монет! Нужно 1000 🪙",
    lock_ultra: "🔒 Требуется дост. 'Кликер' (1М кликов)"
  },
  en: {
    t_settings: "Settings", t_your_id: "Your ID", t_theme: "Theme", t_lang: "Language", t_save: "Save",
    t_crystals: "Crystals", t_coins: "Coins", t_power: "Power", t_cooldown: "Cooldown", t_total_clicks: "Total Clicks",
    t_shop_title: "Rarity Shop", t_close_shop: "Close", t_super_up: "Super-click x2", t_super_desc: "24h → 12h",
    t_withdraw_title: "Withdraw", t_req_btn: "Request", t_cancel: "Cancel",
    t_nav_shop: "Shop", t_nav_daily: "Daily", t_nav_withdraw: "Payout",
    t_daily_title: "Rewards", t_close_daily: "Close", t_day: "Day", t_claim: "Claim",
    t_exchange_lbl: "♻️ Exchange 1000 🪙 ➔ 1 💎",
    wait: "Wait: ", jackpot: "SUPER-CLICK: ", low_money: "Not enough resources!", bought: "Owned",
    withdraw_to: "Withdraw to ID: ", next: "Next: ", ex_ok: "Exchange done! +1 💎", ex_err: "Not enough coins! Need 1000 🪙",
    lock_ultra: "🔒 Requires 'Clicker' ach. (1M clicks)"
  }
};

const SHOP_ITEMS = [
  { id: 'i1', rarity: 'rare', name: '+1 Click', coinPrice: 1000, crystalPrice: 2, power: 1, cd: 3000 },
  { id: 'i2', rarity: 'super-rare', name: '+2 Clicks', coinPrice: 5000, crystalPrice: 10, power: 2, cd: 5000 },
  { id: 'i3', rarity: 'epic', name: '+5 Clicks', coinPrice: 25000, crystalPrice: 50, power: 5, cd: 15000 },
  { id: 'i4', rarity: 'mythic', name: '+10 Clicks', coinPrice: 100000, crystalPrice: 250, power: 10, cd: 300000 },
  { id: 'i5', rarity: 'legendary', name: '+25 Clicks', coinPrice: 500000, crystalPrice: 1500, power: 25, cd: 1800000 },
  { id: 'i6', rarity: 'ultra', name: '+50 Clicks (ULTRA)', coinPrice: 10000000, crystalPrice: null, power: 50, cd: 3600000, reqClicks: 1000000 }
];

let safePurchased = [];
try { 
  let saved = localStorage.getItem("inv_071_final");
  if (saved) safePurchased = JSON.parse(saved); 
} catch(e) { console.log("Ошибка чтения инвентаря"); }

let state = {
  coins: parseFloat(localStorage.getItem("c_071_final")) || 0,
  crystals: parseFloat(localStorage.getItem("cr_071_final")) || 0,
  power: parseFloat(localStorage.getItem("p_071_final")) || 1,
  currentCD: parseInt(localStorage.getItem("cd_071_final")) || 3000,
  playerId: localStorage.getItem("id_071_final") || "",
  theme: localStorage.getItem("th_071_final") || "dark",
  lang: localStorage.getItem("ln_071_final") || "ru",
  cooldownUntil: parseInt(localStorage.getItem("cu_071_final")) || 0,
  superNextClaim: parseInt(localStorage.getItem("sn_071_final")) || 0,
  superInterval: parseInt(localStorage.getItem("si_071_final")) || 86400000,
  dailyDay: parseInt(localStorage.getItem("dd_071_final")) || 0,
  dailyNext: parseInt(localStorage.getItem("dn_071_final")) || 0,
  totalClicks: parseInt(localStorage.getItem("tc_071_final")) || 0,
  purchased: safePurchased
};

let timers = { main: null, super: null, daily: null };

function save() {
  localStorage.setItem("c_071_final", state.coins.toFixed(1));
  localStorage.setItem("cr_071_final", state.crystals.toFixed(1));
  localStorage.setItem("p_071_final", state.power);
  localStorage.setItem("cd_071_final", state.currentCD);
  localStorage.setItem("id_071_final", state.playerId);
  localStorage.setItem("th_071_final", state.theme);
  localStorage.setItem("ln_071_final", state.lang);
  localStorage.setItem("cu_071_final", state.cooldownUntil);
  localStorage.setItem("sn_071_final", state.superNextClaim);
  localStorage.setItem("si_071_final", state.superInterval);
  localStorage.setItem("dd_071_final", state.dailyDay);
  localStorage.setItem("dn_071_final", state.dailyNext);
  localStorage.setItem("tc_071_final", state.totalClicks);
  localStorage.setItem("inv_071_final", JSON.stringify(state.purchased));
}

function updateUI() {
  const L = translations[state.lang];
  
  document.getElementById("coinsVal").innerText = Number(state.coins).toFixed(1);
  document.getElementById("balance").innerText = Number(state.crystals).toFixed(1);
  document.getElementById("powerVal").innerText = state.power;
  document.getElementById("cdVal").innerText = Number(state.currentCD) / 1000;
  document.getElementById("totalClicksVal").innerText = state.totalClicks;
  document.getElementById("displayId").innerText = state.playerId || "-";
  document.getElementById("body").className = state.theme;
  document.getElementById("adminLink").style.display = (state.playerId === ADMIN_SECRET) ? "block" : "none";

  // Безопасный перевод статичных строк
  const translatable = [
    't_settings', 't_your_id', 't_theme', 't_lang', 't_save', 
    't_crystals', 't_coins', 't_power', 't_cooldown', 't_total_clicks',
    't_shop_title', 't_close_shop', 't_super_up', 't_super_desc',
    't_withdraw_title', 't_req_btn', 't_cancel', 't_nav_shop', 
    't_nav_daily', 't_nav_withdraw', 't_daily_title', 't_close_daily', 't_exchange_lbl'
  ];
  
  translatable.forEach(key => {
    let el = document.getElementById(key);
    if (el && L[key]) el.innerText = L[key];
  });

  renderShop();
  renderDailyGrid();
}

function exchangeCoins() {
  const L = translations[state.lang];
  if (state.coins >= 1000) {
    state.coins -= 1000;
    state.crystals += 1;
    save(); updateUI();
    alert(L.ex_ok);
  } else {
    alert(L.ex_err);
  }
}

function renderShop() {
  const L = translations[state.lang];
  const container = document.getElementById("shopList");
  if(!container) return;
  container.innerHTML = "";
  
  SHOP_ITEMS.forEach(item => {
    const isBought = state.purchased.includes(item.id);
    let btnHtml = "";

    if (isBought) {
      btnHtml = `<button disabled>${L.bought}</button>`;
    } else {
      if (item.reqClicks && state.totalClicks < item.reqClicks) {
        btnHtml = `<small style="color:var(--ultra); font-weight:bold; text-align:right;">${L.lock_ultra}<br>(${state.totalClicks}/${item.reqClicks})</small>`;
      } else {
        if (item.coinPrice !== null) {
          btnHtml += `<button class="btn-coin" onclick="buyItem('${item.id}', 'coins')">🪙 ${item.coinPrice}</button>`;
        }
        if (item.crystalPrice !== null) {
          btnHtml += `<button class="btn-crystal" onclick="buyItem('${item.id}', 'crystals')">💎 ${item.crystalPrice}</button>`;
        }
      }
    }

    container.innerHTML += `
      <div class="shop-item ${item.rarity}">
        <div><b>${item.name}</b><br><small>+${item.power} Power | CD: ${item.cd/1000}s</small></div>
        <div class="shop-btn-group">${btnHtml}</div>
      </div>`;
  });
  
  const sUp = document.getElementById("buySuperUpgrade");
  if(sUp) {
    if(state.superInterval < 86400000) { 
      sUp.disabled = true; 
      sUp.innerText = L.bought; 
    } else {
      sUp.disabled = false;
      sUp.innerText = "💎 100";
    }
  }
}

function buyItem(id, mode) {
  const L = translations[state.lang];
  const item = SHOP_ITEMS.find(x => x.id === id);
  if (!item) return;

  if (item.reqClicks && state.totalClicks < item.reqClicks) {
    return alert(L.lock_ultra);
  }

  if (mode === 'coins') {
    if (state.coins < item.coinPrice) return alert(L.low_money);
    state.coins -= item.coinPrice;
  } else if (mode === 'crystals') {
    if (item.crystalPrice === null || state.crystals < item.crystalPrice) return alert(L.low_money);
    state.crystals -= item.crystalPrice;
  }

  state.power += item.power;
  state.currentCD = Number(item.cd) || 3000; 
  state.purchased.push(id);
  save(); updateUI();
}

function buySuperCD() {
  if (state.crystals < 100) return alert(translations[state.lang].low_money);
  state.crystals -= 100;
  state.superInterval = 43200000; 
  save(); updateUI();
}

function renderDailyGrid() {
  const L = translations[state.lang];
  const grid = document.getElementById("dailyGrid");
  if(!grid) return;
  grid.innerHTML = "";
  DAILY_REWARDS.forEach((amt, i) => {
    let cls = "day-card";
    if (i < state.dailyDay) cls += " claimed";
    if (i === state.dailyDay) cls += " active";
    grid.innerHTML += `<div class="${cls}">${L.t_day} ${i+1}<br><b>${amt}💎</b></div>`;
  });

  const btn = document.getElementById("claimBtn");
  if(btn) {
    if (Date.now() < state.dailyNext) {
      btn.disabled = true;
      btn.style.opacity = "0.5";
    } else {
      btn.disabled = false;
      btn.style.opacity = "1";
      btn.innerText = L.t_claim;
    }
  }
}

function claimDaily() {
  if (Date.now() < state.dailyNext) return;
  state.crystals += DAILY_REWARDS[state.dailyDay];
  state.dailyDay = (state.dailyDay + 1) % 7;
  state.dailyNext = Date.now() + 86400000; 
  save(); updateUI();
}

// ПРИВЯЗКА КЛИКА ЧЕРЕЗ АДД_ИВЕНТ_ЛИСТЕНЕР
document.getElementById("clickBtn").addEventListener("click", () => {
  if (Date.now() < Number(state.c
